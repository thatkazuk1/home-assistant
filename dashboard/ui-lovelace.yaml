  # ══════════════════════════════════════════════
  # MASTER BEDROOM SUBVIEW
  # ══════════════════════════════════════════════
  - title: Master Bedroom
    path: master-bedroom
    icon: mdi:bed-king
    subview: true
    cards:
      - type: custom:mod-card
        card_mod:
          style: >
            ha-card {
              max-width: 900px;
              margin: 0 auto;
              padding: 4px 16px 24px 16px !important;
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card::before, ha-card::after { content: none !important; display: none !important; }
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-chips-card
              alignment: start
              chips:
                - type: template
                  icon: mdi:home
                  tap_action:
                    action: navigate
                    navigation_path: /lovelace-yaml/home
                - type: template
                  icon: mdi:bed-king
                  content: Master Bedroom
                - type: template
                  icon: mdi:water-percent
                  icon_color: blue
                  content: "{{ states('sensor.master_bedroom_humidity') | int(0) }}%"
                  card_mod:
                    style: *env_chip
                - type: template
                  icon: mdi:thermometer
                  icon_color: orange
                  content: "{{ states('sensor.master_bedroom_temperature') | round(1) }}°"
                  card_mod:
                    style: *env_chip
                - type: template
                  icon: >-
                    {% set b = states('sensor.master_bedroom_th_battery') %}
                    {{ 'mdi:battery-alert-variant-outline' if b == 'low' else 'mdi:battery-medium' if b == 'middle' else 'mdi:battery' }}
                  icon_color: >-
                    {% set b = states('sensor.master_bedroom_th_battery') %}
                    {{ 'red' if b == 'low' else 'orange' if b == 'middle' else 'green' }}
                  tap_action:
                    action: more-info
                    entity: sensor.master_bedroom_th_battery
                  card_mod:
                    style: *env_chip
              card_mod:
                style: *chip_bar

            # ── Controls ──
            - type: custom:mushroom-template-card
              primary: Controls
              icon: mdi:tune
              card_mod:
                style: *subview_header

            - type: grid
              columns: 3
              square: true
              card_mod:
                style: |
                  :host { --grid-card-gap: 12px !important; }
              cards:
                - type: custom:mushroom-template-card
                  entity: switch.ac_switch_switch_1_3
                  primary: AC
                  secondary: "{{ 'Cooling' if is_state(entity, 'on') else 'Off' }}"
                  icon: mdi:air-conditioner
                  layout: vertical
                  icon_color: "{{ 'cyan' if is_state(entity, 'on') else 'disabled' }}"
                  tap_action:
                    action: toggle
                  card_mod:
                    style: *control_tile


