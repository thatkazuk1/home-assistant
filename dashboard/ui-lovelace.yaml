                                  background: transparent !important;
                                  --ha-card-background: transparent !important;
                                  --mush-card-background-color: transparent !important;
                                  box-shadow: none !important;
                                  --ha-card-box-shadow: none !important;
                                  border: none !important;
                                  --ha-card-border-width: 0 !important;
                                  padding: 0 !important;
                                }
                                ha-card::before, ha-card::after { content: none !important; display: none !important; }
                          - type: horizontal-stack
                            card_mod:
                              style: |
                                #root { display: flex !important; justify-content: center !important; gap: 14px !important; }
                                #root > hui-card { display: contents !important; }
                            cards:
                              - type: custom:button-card
                                icon: mdi:cpu-64-bit
                                show_name: false
                                show_state: false
                                show_label: true
                                label: "[[[ return states['sensor.system_monitor_processor_use'].state + '%' ]]]"
                                size: 16px
                                color: "#42a5f5"
                                entity: sensor.system_monitor_processor_use
                                tap_action:
                                  action: more-info
                                styles: &mini_stat_style
                                  card:
                                    - background: transparent
                                    - box-shadow: none
                                    - border: none
                                    - padding: 0
                                    - width: max-content
                                    - height: 20px
                                  grid:
                                    - grid-template-areas: '"i l"'
                                    - grid-template-columns: 16px auto
                                    - grid-template-rows: 1fr
                                    - column-gap: 4px
                                    - justify-content: center
                                    - align-items: center
                                  icon:
                                    - width: 16px
                                  label:
                                    - font-size: 11px
                                    - font-weight: 500
                                    - color: rgba(255, 255, 255, 0.85)
                              - type: custom:button-card
                                icon: mdi:memory
                                show_name: false
                                show_state: false
                                show_label: true
                                label: "[[[ return states['sensor.system_monitor_memory_usage'].state + '%' ]]]"
                                size: 16px
                                color: "#ab47bc"
                                entity: sensor.system_monitor_memory_usage
                                tap_action:
                                  action: more-info
                                styles: *mini_stat_style
                    - type: horizontal-stack
                      card_mod:
                        style: *host_action_pos
                      cards:
                        - type: custom:button-card
                          icon: mdi:restart
