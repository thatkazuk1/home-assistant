        card_mod:
          style: >
            ha-card {
              max-width: 900px;
              margin: 0 auto;
              padding: 16px;
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
            }
            ha-card::before, ha-card::after { content: none !important; display: none !important; }
        card:
          type: vertical-stack
          cards:
            # Breadcrumb
            - type: custom:mushroom-chips-card
              alignment: start
              chips:
                - type: template
                  icon: mdi:home
                  tap_action:
                    action: navigate
                    navigation_path: /lovelace-yaml/home
                - type: template
                  icon: mdi:server-network
                  content: Infrastructure
              card_mod:
                style: *chip_bar

            # ── Hosts header + Shutdown All (compact power button, same row) ──
            - type: horizontal-stack
              card_mod:
                style: |
                  :host { width: 100% !important; }
                  #root {
                    display: flex !important;
                    width: 100% !important;
                    align-items: center !important;
                    gap: 8px !important;
                  }
                  #root > hui-card { display: contents !important; }
                  #root > hui-card:first-child > * { flex: 1 1 auto !important; }
                  #root > hui-card:last-child > * { flex: 0 0 auto !important; }
              cards:
                - type: custom:mushroom-template-card
                  primary: Hosts
                  icon: mdi:server
                  card_mod:
                    style: *subview_header
                - type: custom:mushroom-template-card
                  icon: mdi:power
                  icon_color: red
                  layout: vertical
                  tap_action:
                    action: none
                  double_tap_action:
                    action: call-service
                    service: shell_command.super_power_button
                    confirmation:
                      text: "⚠️ DANGER: Shut down the entire homelab (all hosts)?"
                  hold_action:
                    action: none
                  card_mod:
                    style: >
                      ha-card {
                        --ha-card-background: rgba(234, 67, 53, 0.12) !important;
                        --mush-card-background-color: transparent !important;
                        --ha-card-box-shadow: 0 0 14px rgba(234, 67, 53, 0.15) !important;
                        --ha-card-border-width: 0 !important;
                        background: var(--ha-card-background) !important;
                        border-radius: 999px !important;
                        border: 2px solid rgba(234, 67, 53, 0.4) !important;
                        width: 44px !important;
                        height: 44px !important;
                        min-height: 44px !important;
                        min-width: 44px !important;
                        padding: 0 !important;
                        display: flex !important;
                        align-items: center !important;
                        justify-content: center !important;
                        flex: 0 0 auto !important;
                      }
                      ha-card:active { transform: scale(0.92) !important; }
                      .container { padding: 0 !important; gap: 0 !important; min-height: unset !important; }
                      ha-card::before, ha-card::after { content: none !important; display: none !important; }

            # ── Device tiles (each: main tile + top-right Reboot/Shutdown overlay) ──
            - type: grid
              columns: 3
              square: false
              card_mod:
                style: |
                  :host { --grid-card-gap: 14px !important; }
              cards:
                # fw-01
                - type: vertical-stack
                  card_mod:
                    style: |
                      #root { position: relative !important; gap: 0 !important; }
                      #root > hui-card { display: contents !important; }
                  cards:
                    - type: custom:mushroom-template-card
                      primary: "fw-01"
                      secondary: "{{ 'Online' if is_state('binary_sensor.fw_01_online', 'on') else 'Offline' }}"
                      icon: mdi:router-network
                      icon_color: "{{ 'green' if is_state('binary_sensor.fw_01_online', 'on') else 'amber' }}"
                      layout: vertical
                      tap_action:
                        action: more-info
                        entity: binary_sensor.fw_01_online
                      card_mod:
                        style: &host_tile >
                          ha-card {
                            --ha-card-background: rgba(255, 255, 255, 0.04) !important;
                            --mush-card-background-color: transparent !important;
                            --ha-card-box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
                            --ha-card-border-width: 0 !important;
                            background: var(--ha-card-background) !important;
                            backdrop-filter: blur(16px) !important;
                            -webkit-backdrop-filter: blur(16px) !important;
                            border-radius: 22px !important;
                            border: 1px solid rgba(255, 255, 255, 0.06) !important;
                            padding: 48px 12px 22px 12px !important;
                            min-height: 158px !important;
                            --icon-size: 46px !important;
                            --shape-size: 64px !important;
                            --card-primary-font-size: 17px !important;
                            --card-primary-font-weight: 600 !important;
                            --card-secondary-font-size: 13px !important;
                          }
                          ha-card::before, ha-card::after { content: none !important; display: none !important; }
                    - type: horizontal-stack
                      card_mod:
                        style: &host_action_pos |
                          :host {
                            position: absolute !important;
                            top: 10px !important;
                            right: 10px !important;
                            left: auto !important;
                            width: auto !important;
                            z-index: 3 !important;
                          }
                          #root { display: flex !important; gap: 4px !important; }
                          #root > hui-card { display: contents !important; }
                      cards:
                        - type: custom:button-card
                          icon: mdi:restart
                          show_name: false
                          show_label: false
                          show_state: false
                          size: 12px
                          color: orange
                          tap_action:
                            action: none
                          double_tap_action:
                            action: call-service
                            service: shell_command.host_power_control
                            service_data:
                              host: fw-01
                              action: reboot
                            confirmation:
                              text: "Reboot fw-01 (firewall/router — will briefly drop network)?"
                          hold_action:
                            action: none
                          styles: &mini_btn_style
                            grid:
                              - grid-template-areas: '"i"'
                              - grid-template-columns: 1fr
                              - grid-template-rows: 1fr
                            card:
                              - background: transparent
                              - box-shadow: none
                              - border: none
                              - width: 20px
                              - height: 20px
                              - padding: 0
                              - opacity: 0.55
                            icon:
                              - width: 14px
                        - type: custom:button-card
                          icon: mdi:power
                          show_name: false
                          show_label: false
                          show_state: false
                          size: 12px
                          color: red
                          tap_action:
                            action: none
                          double_tap_action:
                            action: call-service
                            service: shell_command.host_power_control
                            service_data:
                              host: fw-01
                              action: shutdown
                            confirmation:
                              text: "⚠️ Shut down fw-01 (firewall/router — will take the network down)?"
                          hold_action:
                            action: none
                          styles: *mini_btn_style

                # core-01 (self — CPU/Mem shown with dedicated icons, no ping needed)
                - type: vertical-stack
                  card_mod:
                    style: |
                      #root { position: relative !important; gap: 0 !important; }
                      #root > hui-card { display: contents !important; }
                  cards:
                    - type: custom:mod-card
                      card_mod:
                        style: *host_tile
                      card:
                        type: vertical-stack
                        card_mod:
                          style: |
                            #root { gap: 4px !important; }
                            #root > hui-card { display: contents !important; }
                        cards:
                          - type: custom:mushroom-template-card
