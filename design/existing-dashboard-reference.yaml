## User's existing dashboard — saved as reference for design patterns & entity IDs
## Key patterns:
## - custom:mod-card panel wrapper, max-width: 1050px centered
## - Bubble horizontal-buttons-stack at TOP (sticky), not bottom
## - Mushroom chips bar: time, weather, person, batteries
## - Mushroom template cards as transparent section headers
## - Glassmorphism: rgba(255,255,255,0.06), blur(25px) saturate(120%), border-top: rgba(255,255,255,0.2)
## - 2-column grid, responsive at 800px
## - Room cards: square grid with background images + gradient mask
## - Subviews for rooms (not pop-ups)
## - stack-in-card + mini-graph-card for energy charts
## - Bubble card only for: horizontal-buttons-stack, washer progress bar
##
