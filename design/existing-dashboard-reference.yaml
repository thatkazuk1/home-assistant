## Infrastructure/Hosts subview (added 2026-09-29, per-host power management):
## - New top-level view "Infrastructure" (/lovelace-yaml/infrastructure), 3-per-row grid
##   ordered fw-01 -> core-01 -> nas-01 -> pve-01 -> pve-02
## - Per-host glass card: rgba(255,255,255,0.04) bg, blur(16px), border-radius 22px,
##   NO pill/chip backgrounds anywhere (custom:button-card direct styling, not mushroom-chips)
## - Top-right overlay per card: small amber reboot (mdi:restart) + red shutdown (mdi:power)
##   icon buttons, double-tap to trigger with confirmation dialog (tap/hold are no-ops)
## - core-01 card: CPU/Mem shown as icon+label button-card chips (transparent bg),
##   reusing sensor.system_monitor_processor_use / sensor.system_monitor_memory_usage
## - "Hosts" header row: compact round red icon-button (44px) aligned far right,
##   double-tap -> shell_command.super_power_button (the original "shut down everything")
##
## NEW ENTITY IDs:
## binary_sensor.nas_01_online / .pve_01_online / .pve_02_online / .fw_01_online
