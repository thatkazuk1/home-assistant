            # ── Appliances (Washer) ──
            - type: custom:mushroom-template-card
              primary: Appliances
              icon: mdi:washing-machine
              card_mod:
                style: *subview_header

            - type: custom:bubble-card
              card_type: button
              button_type: state
              card_layout: large-2-rows
              entity: sensor.washer_current_status
              name: Washer
              icon: mdi:washing-machine
              show_state: true
              show_last_changed: false
              show_attribute: false
              styles: |
                .bubble-button-card-container {
                  background: rgba(255, 255, 255, 0.04) !important;
                  backdrop-filter: blur(30px) saturate(140%) !important;
                  -webkit-backdrop-filter: blur(30px) saturate(140%) !important;
                  border-radius: 25px !important;
                  border: 1px solid rgba(255, 255, 255, 0.04) !important;
                  border-top: 1px solid rgba(255, 255, 255, 0.12) !important;
                  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1) !important;
                  position: relative !important;
                  overflow: hidden !important;
                }
                .bubble-icon {
                  animation: none !important;
                  color: ${
                    (() => {
                      const s = hass.states['sensor.washer_current_status'];
                      const pw = hass.states['switch.washer_power_2'];
                      if (!s || !pw) return 'rgba(255,255,255,0.3)';
                      const v = s.state.toLowerCase();
                      const idle = ['off','-','unknown','unavailable','idle','standby','sleep','end','complete'];
                      return (pw.state === 'on' && !idle.includes(v)) ? '#448AFF' : 'rgba(255,255,255,0.3)';
                    })()
                  } !important;
                }
                .bubble-icon.is-active {
                  ${
                    (() => {
                      const s = hass.states['sensor.washer_current_status'];
                      const pw = hass.states['switch.washer_power_2'];
                      if (!s || !pw) return 'animation: none !important;';
                      const v = s.state.toLowerCase();
                      const idle = ['off','-','unknown','unavailable','idle','standby','sleep','end','complete','pause','error'];
                      return (pw.state === 'on' && !idle.includes(v)) ? 'animation: spin 2s linear infinite !important;' : 'animation: none !important;';
                    })()
                  }
                }
                @keyframes spin { 100% { transform: rotate(360deg); } }
                .bubble-name { font-weight: 500 !important; }
                .bubble-state { font-size: 13px !important; opacity: 0.7 !important; }
                .bubble-button-card-container::after {
                  content: '' !important;
                  display: block !important;
                  position: absolute !important;
                  top: 0 !important;
                  left: 0 !important;
                  height: 100% !important;
                  ${
                    (() => {
                      const status = hass.states['sensor.washer_current_status'];
                      const total = hass.states['sensor.washer_total_time'];
                      const endTime = hass.states['sensor.washer_remaining_time_2'];
                      if (!status || !total || !endTime) return 'width: 0%; background: transparent;';
                      const v = status.state.toLowerCase();
                      const idle = ['off','-','unknown','unavailable','idle','standby','sleep','end','complete','pause','error'];
                      const t = parseFloat(total.state) || 0;
                      if (idle.includes(v) || t <= 0) return 'width: 0%; background: transparent;';
                      const end = new Date(endTime.state);
                      const now = new Date();
                      const remainMin = Math.max(0, (end - now) / 60000);
                      const pct = Math.min(((t - remainMin) / t) * 100, 100).toFixed(1);
                      return 'width: ' + pct + '%; background: linear-gradient(90deg, rgba(33,150,243,0.35) 0%, rgba(33,150,243,0.12) 100%);';
                    })()
                  }
                  border-radius: 25px !important;
                  z-index: 0 !important;
                  transition: width 60s linear !important;
                  pointer-events: none !important;
                }
                .bubble-sub-button-container {
                  margin-left: auto !important;
                  margin-right: 16px !important;
                  width: auto !important;
                  z-index: 2 !important;
                }
                .bubble-sub-button-1 { margin: 0 !important; }
              sub_button:
                - entity: sensor.washer_remaining_minutes
                  icon: mdi:timer-outline
                  show_background: false
                  show_state: true
                  tap_action:
                    action: more-info

            # ── Energy Monitoring ──
            - type: custom:mushroom-template-card
              primary: Energy Monitoring
              icon: mdi:flash
              card_mod:
                style: *subview_header

            - type: grid
              columns: 2
              square: false
              card_mod:
                style: >
                  :host { --grid-card-gap: 12px !important; }
                  @media (max-width: 800px) { :host { --grid-card-column-count: 1 !important; } }
              cards:
                - type: custom:stack-in-card
                  card_mod:
                    style: >
                      ha-card {
                        --ha-card-background: rgba(255, 255, 255, 0.04) !important;
                        --mush-card-background-color: transparent !important;
                        --ha-card-box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.2) !important;
                        --ha-card-border-width: 0 !important;
                        background: var(--ha-card-background) !important;
                        backdrop-filter: blur(30px) saturate(140%) !important;
                        -webkit-backdrop-filter: blur(30px) saturate(140%) !important;
                        border-radius: 24px !important;
                        border: 1px solid rgba(255, 255, 255, 0.04) !important;
                        border-top: 1px solid rgba(255, 255, 255, 0.12) !important;
                        padding: 16px !important;
                        overflow: hidden;
                        display: flex !important;
                        flex-direction: column !important;
                        justify-content: space-between !important;
                        height: 100% !important;
                      }
                      ha-card::before, ha-card::after { content: none !important; display: none !important; }
                  cards:
                    - type: custom:mushroom-entity-card
                      entity: sensor.t34_smart_plug_power
                      name: Socket
                      icon: mdi:power-socket-uk
                      icon_color: orange
                      card_mod:
